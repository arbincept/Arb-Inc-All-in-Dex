<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Arb-Inc All-in-Dex — by Lukecele</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #030014; }
    body { color: #faf8ff; font-family: Arial, Helvetica, sans-serif; }
    .card {
      width: 1280px; height: 640px; padding: 56px 64px; position: relative;
      overflow: hidden; isolation: isolate; display: flex; flex-direction: column;
      background: radial-gradient(ellipse at 95% 5%, #361c66 0, transparent 54%), #080416;
    }
    .card::before {
      content: ""; position: absolute; inset: 22px; border: 1px solid #493464;
      border-radius: 24px; z-index: -1;
    }
    header { display: flex; align-items: center; justify-content: space-between; }
    .eyebrow { margin: 0; font-size: 20px; letter-spacing: 3px; font-weight: 700; color: #c2addf; }
    .signature { margin: 0; font-size: 30px; font-weight: 700; color: #f6cb87; }
    .hero { display: grid; grid-template-columns: 1fr 310px; align-items: center; flex: 1; gap: 28px; }
    h1 { margin: 0 0 22px; font-size: 62px; line-height: 1.04; letter-spacing: -2.5px; }
    .message { margin: 0; font-size: 42px; line-height: 1.18; letter-spacing: -1px; color: #d8c6ff; }
    .message span { color: #faf8ff; }
    .details { margin: 24px 0 0; font-size: 21px; color: #c2b7d5; }
    img { width: 300px; height: 300px; border-radius: 30px; border: 1px solid #493464; }
    footer { border-top: 1px solid #493464; padding-top: 25px; display: flex; justify-content: space-between; align-items: center; }
    .url { font-size: 25px; font-weight: 700; }
    .cta { color: #d8c6ff; font-size: 21px; }
    /* The export is a fixed 1280×640 canvas. A small-screen view scales the entire card. */
    @media (max-width: 1279px) {
      .card { transform-origin: top left; transform: scale(calc(100vw / 1280px)); }
      body { width: 100vw; height: 50vw; overflow: hidden; }
    }
  </style>
</head>
<body>
  <main class="card" aria-label="Arb-Inc All-in-Dex social card">
    <header>
      <p class="eyebrow">ARBITRAGE INCEPTION / OPEN SOURCE</p>
      <p class="signature">by Lukecele</p>
    </header>
    <div class="hero">
      <div>
        <h1>Arb-Inc All-in-Dex</h1>
        <p class="message">Swap, bridge,<br><span>and explore DeFi.</span></p>
        <p class="details">DEX aggregation · Cross-chain routes · Limit orders</p>
      </div>
      <img src="../public/logo.jpg" width="300" height="300" alt="Arbitrage Inception logo">
    </div>
    <footer>
      <span class="url">arbitrage-inc.exchange</span>
      <span class="cta">Explore the app · Star the repo · Follow @Lukecele</span>
    </footer>
  </main>
</body>
</html>
